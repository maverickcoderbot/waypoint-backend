spring.application.name=waypoint-backend

# --- Datasource (override via env in every environment) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/waypoint}
spring.datasource.username=${DATABASE_USER:waypoint}
spring.datasource.password=${DATABASE_PASSWORD:waypoint}

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate neither creates nor validates it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- CORS (comma-separated origins allowed to call /api/**) ---
waypoint.allowed-origins=${WAYPOINT_ALLOWED_ORIGINS:http://localhost:8000,http://127.0.0.1:8000}

# --- Actuator: expose health only ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# --- Overpass proxy (durations accept s/m/h suffixes; mirrors are tried in order) ---
waypoint.overpass.bbox.south=${WAYPOINT_OVERPASS_BBOX_SOUTH:38.35}
waypoint.overpass.bbox.west=${WAYPOINT_OVERPASS_BBOX_WEST:-90.9}
waypoint.overpass.bbox.north=${WAYPOINT_OVERPASS_BBOX_NORTH:39.05}
waypoint.overpass.bbox.east=${WAYPOINT_OVERPASS_BBOX_EAST:-89.95}
waypoint.overpass.ttl=${WAYPOINT_OVERPASS_TTL:24h}
waypoint.overpass.rate-max=${WAYPOINT_OVERPASS_RATE_MAX:30}
waypoint.overpass.rate-window=${WAYPOINT_OVERPASS_RATE_WINDOW:60s}
waypoint.overpass.mirrors=${WAYPOINT_OVERPASS_MIRRORS:https://overpass-api.de/api/interpreter,https://maps.mail.ru/osm/tools/overpass/api/interpreter,https://overpass.private.coffee/api/interpreter,https://overpass.kumi.systems/api/interpreter}
waypoint.overpass.user-agent=${WAYPOINT_OVERPASS_USER_AGENT:Waypoint/1.0 (Overpass caching proxy)}
waypoint.overpass.upstream-timeout=${WAYPOINT_OVERPASS_UPSTREAM_TIMEOUT:30s}

# --- Geocode proxy ---
waypoint.geocode.rate-max=${WAYPOINT_GEOCODE_RATE_MAX:30}
waypoint.geocode.rate-window=${WAYPOINT_GEOCODE_RATE_WINDOW:60s}
waypoint.geocode.ttl=${WAYPOINT_GEOCODE_TTL:7d}
waypoint.geocode.user-agent=${WAYPOINT_GEOCODE_USER_AGENT:Waypoint/1.0 (Geocode caching proxy)}
waypoint.geocode.upstream-timeout=${WAYPOINT_GEOCODE_UPSTREAM_TIMEOUT:30s}
waypoint.geocode.nominatim-base-url=${WAYPOINT_GEOCODE_NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org/search}
waypoint.geocode.open-meteo-base-url=${WAYPOINT_GEOCODE_OPEN_METEO_BASE_URL:https://geocoding-api.open-meteo.com/v1/search}

# --- Elevation proxy ---
waypoint.elevation.rate-max=${WAYPOINT_ELEVATION_RATE_MAX:30}
waypoint.elevation.rate-window=${WAYPOINT_ELEVATION_RATE_WINDOW:60s}
waypoint.elevation.ttl=${WAYPOINT_ELEVATION_TTL:30d}
waypoint.elevation.user-agent=${WAYPOINT_ELEVATION_USER_AGENT:Waypoint/1.0 (Elevation caching proxy)}
waypoint.elevation.upstream-timeout=${WAYPOINT_ELEVATION_UPSTREAM_TIMEOUT:30s}
waypoint.elevation.max-points=${WAYPOINT_ELEVATION_MAX_POINTS:512}
waypoint.elevation.bbox.south=${WAYPOINT_ELEVATION_BBOX_SOUTH:38.35}
waypoint.elevation.bbox.west=${WAYPOINT_ELEVATION_BBOX_WEST:-90.9}
waypoint.elevation.bbox.north=${WAYPOINT_ELEVATION_BBOX_NORTH:39.05}
waypoint.elevation.bbox.east=${WAYPOINT_ELEVATION_BBOX_EAST:-89.95}
waypoint.elevation.base-url=${WAYPOINT_ELEVATION_BASE_URL:https://api.open-meteo.com/v1/elevation}
